name: CI-CD Skeleton

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (esqueleto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend (React) - Lint and Build
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Backend (Python) - placeholder
        working-directory: api
        run: |
