name: CI-CD Skeleton

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (esqueleto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend (React) - Lint and Build
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Backend (Python) - placeholder
        working-directory: api
        run: |
          echo "OK - CI backend"
          # Futuro (framework ainda não definido):
          # pip install -r requirements.txt
          # pytest

  backend-quality:
    name: Backend - Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Black
        working-directory: api
        run: black --check .
      - name: Run isort
        working-directory: api
        run: isort --check-only .
      - name: Run Flake8
        working-directory: api
        run: flake8 .
      - name: Run mypy
        working-directory: api
        run: mypy . || true
      - name: Run pytest
        working-directory: api
        run: pytest --tb=short

  frontend-quality:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run ESLint
        working-directory: app
        run: npm run lint
      - name: Build
        working-directory: app
        run: npm run build

  cd:
    name: CD (esqueleto)
    runs-on: ubuntu-latest
    needs: [ci, backend-quality, frontend-quality]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy placeholder
        run: echo "OK - CD placeholder"