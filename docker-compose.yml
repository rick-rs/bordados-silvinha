services:
  postgres:
    image: postgres:16-alpine
    container_name: bordados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bordados -d bordados']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    build: ./api
    container_name: bordadosapi
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./api:/app
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_dev_user && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./app
    container_name: bordados-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    env_file:
      - app/.env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./app:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
